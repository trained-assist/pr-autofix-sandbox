name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  autofix:
    needs: [ci]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      needs.ci.result == 'failure' &&
      !startsWith(github.head_ref, 'fix/ci-')
    permissions:
      contents: write
      pull-requests: write
    # Pinned to the pr-autofix revision under test — bump when smoking a new version.
    uses: trained-assist/pr-autofix/.github/workflows/autofix-callable.yml@c08216e12d04518b9a5958bbb84f51bf7464493c
    with:
      pr_number: ${{ github.event.pull_request.number }}
      original_branch: ${{ github.head_ref }}
      run_id: ${{ github.run_id }}
    secrets:
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      gh_token: ${{ secrets.AUTOFIX_PAT || github.token }}
